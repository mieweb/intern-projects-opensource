name: Update README Repo Dates

on:
  # Run every Monday at 06:00 UTC
  schedule:
    - cron: '0 6 * * 1'

  # Allow triggering manually from the Actions tab
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-dates:
    name: Refresh last-push dates
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run update script
        env:
          # GITHUB_TOKEN is automatically provided by Actions and has read
          # access to public repos — no additional secret needed.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/update-repo-dates.js

      - name: Commit and push if README changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git diff --quiet README.md && echo "No changes to commit." || \
          (git add README.md && \
           git commit -m "chore: update repo last-push dates [skip ci]" && \
           git push)
